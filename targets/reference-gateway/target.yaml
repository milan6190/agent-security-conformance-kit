# Known-good reference target. Expected result: every test passes.
#   export ASCK_JWT_SECRET=$(openssl rand -hex 32) MCP_UPSTREAM_AUTH="Bearer upstream-only-token"
#   go run ./cmd/reference-gateway -config targets/reference-gateway/config.json &
#   go run ./cmd/asck run -target targets/reference-gateway/target.yaml -tests tests
name: reference-gateway
endpoint: http://127.0.0.1:8080/mcp
canary_listen: 127.0.0.1:9901
jwt:
  secret_env: ASCK_JWT_SECRET
  issuer: https://idp.asck.invalid
  audience: reference-gateway
principals:
  reader: {claims: {sub: asck-reader, roles: [reader]}}
  admin: {claims: {sub: asck-admin, roles: [admin]}}
