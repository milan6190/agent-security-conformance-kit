name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make lint
      - run: make test
      - name: Demo against reference targets
        run: make demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-reports
          path: reports
