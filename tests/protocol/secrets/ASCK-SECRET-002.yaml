id: ASCK-SECRET-002
title: Secrets in tool call arguments are not forwarded to the tool
aisvs: ["9.5.4"]
risks: [MCP01]
level: 2
requires: [principal:reader]
steps:
  - name: arguments carry a credential
    as: reader
    rpc: {method: tools/call, params: {name: search_docs, arguments: {query: "why does key ${canary.aws_key} fail?"}}}
    expect:
      canary_called: [search_docs]
      canary_received_not_contains: ["${canary.aws_key}"]
